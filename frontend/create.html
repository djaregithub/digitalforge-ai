<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalForge AI - Create Invoice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.08);
            --text: #e0e0e0;
            --text-dim: #888;
            --purple: #7c3aed;
            --blue: #3b82f6;
            --gradient: linear-gradient(135deg, #7c3aed, #3b82f6);
            --success: #4ade80;
            --error: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bg-glow {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.12) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.08) 0%, transparent 50%);
            animation: glowShift 15s ease-in-out infinite alternate;
        }
        @keyframes glowShift {
            0% { transform: translate(0,0) rotate(0deg); }
            100% { transform: translate(-5%,5%) rotate(5deg); }
        }
        header {
            width: 100%; max-width: 1100px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.5rem 2rem;
        }
        .logo { font-size: 1.5rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo span { -webkit-text-fill-color: var(--text); font-weight: 400; }
        header nav a { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; margin-left: 2rem; }
        header nav a:hover { color: #fff; }
        .container {
            width: 100%; max-width: 1100px;
            padding: 2rem;
            display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(12px);
        }
        .card-title {
            font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem;
            text-align: center; color: var(--text-dim);
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 500;
            color: var(--text-dim); margin-bottom: 0.4rem;
        }
        .form-control {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
        }
        .form-control::placeholder { color: #555; }
        .input-group { display: flex; gap: 0; }
        .input-group .form-control:first-child { 
            border-radius: 8px 0 0 8px;
            border-right: none;
        }
        .input-group select.form-control:last-child {
            border-radius: 0 8px 8px 0;
            width: 110px;
            flex-shrink: 0;
            cursor: pointer;
        }
        textarea.form-control { min-height: 80px; resize: vertical; }
        .form-error {
            font-size: 0.75rem; color: var(--error); margin-top: 0.25rem;
            display: none;
        }
        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            background: var(--gradient);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(124,58,237,0.4);
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .preview-box {
            text-align: center; padding: 1rem 0;
        }
        .preview-qr {
            width: 180px; height: 180px;
            background: rgba(0,0,0,0.3);
            border: 2px dashed var(--border);
            border-radius: 12px;
            margin: 0 auto 1.5rem;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); font-size: 0.85rem;
        }
        .preview-qr img { width: 100%; height: 100%; object-fit: contain; }
        .preview-amount { font-size: 2.2rem; font-weight: 700; color: #fff; }
        .preview-token { font-size: 1rem; color: var(--text-dim); margin-left: 0.3rem; }
        .preview-wallet { margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-dim); word-break: break-all; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 1000;
            display: none; align-items: center; justify-content: center;
        }
        .overlay.show { display: flex; }
        .modal {
            background: #111;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            width: 90%; max-width: 440px;
            text-align: center;
            position: relative;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal .close {
            position: absolute; top: 1rem; right: 1.2rem;
            font-size: 2rem; color: var(--text-dim); cursor: pointer;
            background: none; border: none; line-height: 1;
        }
        .modal .close:hover { color: #fff; }
        .modal h2 { font-size: 1.6rem; margin-bottom: 0.3rem; color: var(--success); }
        .modal p { color: var(--text-dim); margin-bottom: 1.5rem; font-size: 0.9rem; }
        #modal-qr {
            width: 200px; height: 200px;
            background: #fff; padding: 8px;
            border-radius: 12px;
            margin: 0 auto 1.2rem;
        }
        .url-row {
            display: flex; margin-bottom: 0.8rem;
        }
        .url-row input {
            flex: 1; padding: 0.7rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: var(--text);
            font-size: 0.85rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .url-row button {
            padding: 0 1rem;
            background: var(--purple);
            border: none;
            border-radius: 0 8px 8px 0;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .url-row button:hover { background: #6d28d9; }
        .btn-wa {
            display: block;
            padding: 0.8rem;
            background: #25D366;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-wa:hover { background: #1da851; }
        .toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            z-index: 2000;
            display: none;
            animation: toastIn 0.3s ease;
        }
        .toast.error { background: var(--error); color: #fff; display: block; }
        .toast.success { background: var(--success); color: #000; display: block; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 1rem; text-align: center; }
            header nav a { margin: 0 0.5rem; }
        }
    </style>
</head>
<body>
<div class="bg-glow"></div>

<header>
    <div class="logo">DigitalForge<span> AI</span></div>
    <nav>
        <a href="/">Home</a>
        <a href="/create">Create Invoice</a>
    </nav>
</header>

<div class="container">
    <div class="card">
        <div class="card-title">Create Invoice</div>
        <form id="invoiceForm">
            <div class="form-group">
                <label>Amount & Token</label>
                <div class="input-group">
                    <input type="number" id="amount" class="form-control" placeholder="100.00" step="0.01" min="0.01" required>
                    <select id="token" class="form-control">
                        <option value="USDT">USDT</option>
                        <option value="USDC">USDC</option>
                    </select>
                </div>
                <div class="form-error" id="amountError">Please enter a valid amount</div>
            </div>
            <div class="form-group">
                <label>Your Wallet Address (Polygon)</label>
                <input type="text" id="wallet" class="form-control" placeholder="0x..." value="__DEFAULT_WALLET__" required pattern="^0x[a-fA-F0-9]{40}$">
                <div class="form-error" id="walletError">Enter a valid Polygon wallet (0x... 42 chars)</div>
            </div>
            <div class="form-group">
                <label>Your Name (Optional)</label>
                <input type="text" id="name" class="form-control" placeholder="Your name or company">
            </div>
            <div class="form-group">
                <label>Email for Notification (Optional)</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Memo / Note (Optional)</label>
                <textarea id="memo" class="form-control" placeholder="Invoice for..."></textarea>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">
                <span id="btnLabel">Generate Invoice</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>
    </div>

    <div class="card">
        <div class="card-title">Live Preview</div>
        <div class="preview-box">
            <div class="preview-qr" id="previewQr">
                <span>QR will appear here</span>
            </div>
            <div class="preview-amount" id="previewAmount">$0.00</div>
            <div class="preview-token" id="previewToken">USDT</div>
            <div class="preview-wallet" id="previewWallet">0x...</div>
        </div>
    </div>
</div>

<div class="overlay" id="successOverlay">
    <div class="modal">
        <button class="close" id="closeModal">&times;</button>
        <h2>Invoice Generated!</h2>
        <p>Share this link or QR with your customer</p>
        <img id="modalQr" src="" alt="QR Code">
        <div class="url-row">
            <input type="text" id="paymentUrl" readonly>
            <button id="copyBtn">Copy</button>
        </div>
        <a href="#" id="waBtn" class="btn-wa" target="_blank">Send via WhatsApp</a>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
    const form = document.getElementById('invoiceForm');
    const amount = document.getElementById('amount');
    const token = document.getElementById('token');
    const wallet = document.getElementById('wallet');
    const name = document.getElementById('name');
    const email = document.getElementById('email');
    const memo = document.getElementById('memo');
    const submitBtn = document.getElementById('submitBtn');
    const btnLabel = document.getElementById('btnLabel');
    const spinner = document.getElementById('spinner');
    
    const pAmount = document.getElementById('previewAmount');
    const pToken = document.getElementById('previewToken');
    const pWallet = document.getElementById('previewWallet');
    const pQr = document.getElementById('previewQr');
    
    const overlay = document.getElementById('successOverlay');
    const closeModal = document.getElementById('closeModal');
    const modalQr = document.getElementById('modalQr');
    const paymentUrl = document.getElementById('paymentUrl');
    const copyBtn = document.getElementById('copyBtn');
    const waBtn = document.getElementById('waBtn');
    const toast = document.getElementById('toast');

    function maskWallet(addr) {
        if (!addr || addr.length < 10) return '0x...';
        return addr.slice(0,6)+'...'+addr.slice(-4);
    }

    function updatePreview() {
        const amt = parseFloat(amount.value) || 0;
        pAmount.textContent = '$'+amt.toFixed(2);
        pToken.textContent = token.value;
        pWallet.textContent = maskWallet(wallet.value);
    }
    [amount, token, wallet].forEach(el => el.addEventListener('input', updatePreview));
    updatePreview();

    function showToast(msg, type) {
        toast.textContent = msg;
        toast.className = 'toast '+type;
        setTimeout(() => { toast.className = 'toast'; }, 4000);
    }

    function setLoading(loading) {
        btnLabel.style.display = loading ? 'none' : 'inline';
        spinner.style.display = loading ? 'block' : 'none';
        submitBtn.disabled = loading;
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const amt = parseFloat(amount.value);
        if (!amt || amt <= 0) { showToast('Enter a valid amount', 'error'); return; }
        const addr = wallet.value.trim();
        if (!/^0x[a-fA-F0-9]{40}$/.test(addr)) { showToast('Invalid wallet address', 'error'); return; }

        setLoading(true);
        
        try {
            const res = await fetch('/api/invoices/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    amount: amt,
                    token: token.value,
                    merchant_wallet: addr,
                    merchant_name: name.value.trim() || null,
                    email_merchant: email.value.trim() || null,
                    memo: memo.value.trim() || null
                })
            });
            
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Failed to create invoice');
            
            // Show success
            modalQr.src = data.invoice.qr_base64;
            paymentUrl.value = data.invoice.payment_url;
            waBtn.href = 'https://wa.me/?text=Pay%20my%20invoice:%20'+encodeURIComponent(data.invoice.payment_url);
            overlay.classList.add('show');
            showToast('Invoice created! Share the link with your client', 'success');
        } catch(err) {
            showToast(err.message, 'error');
        } finally {
            setLoading(false);
        }
    });

    closeModal.addEventListener('click', () => overlay.classList.remove('show'));
    overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('show'); });

    copyBtn.addEventListener('click', function() {
        paymentUrl.select();
        navigator.clipboard.writeText(paymentUrl.value).then(() => {
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
        }).catch(() => {
            document.execCommand('copy');
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = 'Copy'; }, 2000);
        });
    });
})();
</script>
</body>
</html>
