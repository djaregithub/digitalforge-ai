<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Credits - DigitalForge AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a0a0f; color:#e0e0e0; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
        .bg-glow { position:fixed; top:-50%; left:-50%; width:200%; height:200%; z-index:-1; background:radial-gradient(ellipse at 20% 50%,rgba(124,58,237,0.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(59,130,246,0.08) 0%,transparent 50%); }
        .container { max-width:700px; width:100%; padding:2rem; margin-top:2rem; }
        h1 { font-size:1.8rem; font-weight:700; text-align:center; background:linear-gradient(135deg,#7c3aed,#3b82f6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:0.5rem; }
        .subtitle { text-align:center; color:#888; margin-bottom:2rem; font-size:0.9rem; }
        .plans { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
        .plan { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:2rem 1.5rem; text-align:center; transition:all 0.3s; cursor:pointer; }
        .plan:hover { border-color:#7c3aed; transform:translateY(-2px); }
        .plan.featured { border-color:rgba(124,58,237,0.5); background:rgba(124,58,237,0.05); }
        .plan h3 { font-size:1.1rem; font-weight:600; color:#fff; margin-bottom:0.5rem; }
        .plan .price { font-size:2rem; font-weight:700; color:#fff; margin-bottom:0.3rem; }
        .plan .price span { font-size:0.85rem; color:#888; font-weight:400; }
        .plan .note { font-size:0.8rem; color:#666; margin-bottom:1rem; }
        .plan ul { list-style:none; text-align:left; margin:1rem 0; }
        .plan ul li { padding:0.3rem 0; font-size:0.85rem; color:#a0a0a8; }
        .plan ul li::before { content:'✓'; color:#4ade80; margin-right:0.5rem; }
        .plan .badge { display:inline-block; background:linear-gradient(135deg,#7c3aed,#3b82f6); padding:0.2rem 0.8rem; border-radius:100px; font-size:0.7rem; font-weight:600; color:#fff; margin-bottom:0.8rem; }
        .pay-section { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:2rem; margin-top:2rem; text-align:center; display:none; }
        .pay-section.show { display:block; }
        .pay-section h3 { margin-bottom:1rem; }
        .pay-section .wallet { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:0.8rem; font-family:monospace; font-size:0.85rem; word-break:break-all; margin-bottom:1rem; color:#a78bfa; }
        .form-control { width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); color:#e0e0e0; padding:0.75rem 1rem; border-radius:8px; font-family:'Inter',sans-serif; font-size:0.9rem; margin-bottom:0.8rem; }
        .form-control:focus { outline:none; border-color:#7c3aed; }
        .btn-primary { width:100%; padding:0.9rem; background:linear-gradient(135deg,#7c3aed,#3b82f6); border:none; border-radius:8px; color:#fff; font-size:1rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .btn-primary:hover { transform:translateY(-1px); box-shadow:0 8px 25px rgba(124,58,237,0.4); }
        .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
        .result { margin-top:1rem; padding:0.8rem; border-radius:8px; display:none; }
        .result.success { display:block; background:rgba(74,222,128,0.1); color:#4ade80; }
        .result.error { display:block; background:rgba(239,68,68,0.1); color:#ef4444; }
        .back-link { display:block; text-align:center; margin-top:1.5rem; color:#666; text-decoration:none; font-size:0.85rem; }
        .back-link:hover { color:#a78bfa; }
        @media(max-width:600px) { .plans { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="container">
    <h1>Buy Credits</h1>
    <p class="subtitle">Send USDT to our wallet, get invoice credits instantly</p>

    <div class="plans" id="plans"></div>

    <div class="pay-section" id="paySection">
        <h3>Send USDT to this wallet on Polygon</h3>
        <div class="wallet" id="merchantWallet">0x47b82a02963CDe4f9625B9C583B41c72956Bc2E8</div>
        <p style="font-size:0.8rem;color:#666;margin-bottom:1rem">Amount: <strong id="payAmount">$5 USDT</strong></p>
        <input type="text" id="walletInput" class="form-control" placeholder="Your wallet address (0x...)" value="__DEFAULT_WALLET__">
        <input type="text" id="txHash" class="form-control" placeholder="Transaction hash (0x...) after sending">
        <button class="btn-primary" id="confirmBtn">Confirm Payment</button>
        <div class="result" id="result"></div>
    </div>

    <a href="/create" class="back-link">← Back to Create Invoice</a>
</div>

<script>
    const PLANS = { starter:{usdt:5,credits:20,label:'Starter'}, pro:{usdt:12,credits:200,label:'Pro'}, business:{usdt:49,credits:-1,label:'Business'} };
    const DEFAULT_WALLET = '0x47b82a02963CDe4f9625B9C583B41c72956Bc2E8';
    let selectedPlan = 'starter';

    // Render plans
    const plansDiv = document.getElementById('plans');
    Object.entries(PLANS).forEach(([key, p], i) => {
        const div = document.createElement('div');
        div.className = 'plan' + (key === 'pro' ? ' featured' : '');
        div.innerHTML = `
            ${key === 'pro' ? '<div class="badge">Most Popular</div>' : ''}
            <h3>${p.label}</h3>
            <div class="price">$${p.usdt} <span>USDT</span></div>
            <div class="note">${p.credits === -1 ? 'Unlimited invoices' : p.credits + ' invoices'}</div>
            <ul>
                <li>${p.credits === -1 ? 'Unlimited' : p.credits} invoice credits</li>
                <li>No expiry</li>
                <li>QR code included</li>
            </ul>
            <button class="select-btn" data-plan="${key}" style="width:100%;margin-top:1rem;padding:0.7rem;background:${key === 'pro' ? 'linear-gradient(135deg,#7c3aed,#3b82f6)' : 'rgba(255,255,255,0.05)'};border:${key === 'pro' ? 'none' : '1px solid rgba(255,255,255,0.1)'};border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-size:0.9rem;transition:all 0.2s">Select — $${p.usdt} USDT</button>
        `;
        div.querySelector('.select-btn').onclick = (e) => { e.stopPropagation(); selectPlan(key); };
        div.onclick = () => selectPlan(key);
        plansDiv.appendChild(div);
    });

    function selectPlan(key) {
        selectedPlan = key;
        document.querySelectorAll('.plan').forEach(p => p.style.borderColor = 'rgba(255,255,255,0.08)');
        document.querySelectorAll('.plan')[Object.keys(PLANS).indexOf(key)].style.borderColor = '#7c3aed';
        document.getElementById('paySection').classList.add('show');
        document.getElementById('payAmount').textContent = '$' + PLANS[key].usdt + ' USDT';
    }

    // Confirm payment
    document.getElementById('confirmBtn').onclick = async function() {
        const wallet = document.getElementById('walletInput').value.trim();
        const txHash = document.getElementById('txHash').value.trim();
        const btn = this;
        const result = document.getElementById('result');

        if (!/^0x[a-fA-F0-9]{40}$/.test(wallet)) {
            result.className = 'result error'; result.textContent = 'Invalid wallet address'; return;
        }
        if (!txHash || txHash.length < 10) {
            result.className = 'result error'; result.textContent = 'Enter transaction hash'; return;
        }

        btn.disabled = true; btn.textContent = 'Processing...';
        try {
            const res = await fetch('/api/credits/buy', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({wallet_address: wallet, plan: selectedPlan, tx_hash: txHash})
            });
            const data = await res.json();
            if (data.success) {
                result.className = 'result success';
                result.innerHTML = '✅ ' + data.message + ' — <a href="/create" style="color:#a78bfa">Create invoice now</a>';
                btn.textContent = 'Done!';
            } else {
                throw new Error(data.error);
            }
        } catch(e) {
            result.className = 'result error'; result.textContent = 'Error: ' + e.message;
            btn.disabled = false; btn.textContent = 'Confirm Payment';
        }
    };
</script>
</body>
</html>
